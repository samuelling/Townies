<!doctype html>
<!-- The Townies app icon: the splash-screen title across a water tile.
     Rendered to PNG by ios/tools/make_icon.py with a headless browser, so the title uses the game's own font and style. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../css/fonts.css">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; }
  .tlogo { position: absolute; left: 0; right: 0; top: 50%; transform: translate(-8px, -58%); text-align: center;
    font-family: Silkscreen, monospace; font-weight: 700; font-size: 150px; letter-spacing: 5px; line-height: 1;
    color: #ffe680; text-shadow: 10px 10px 0 #b5462a, 20px 20px 0 #2b2b6e; }
</style></head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<div class="tlogo">TOWNIES</div>
<script>
const g = document.getElementById('c').getContext('2d');
const px = 16; // a chunky pixel grid, like the game's tiles up close
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
// one water tile, the game's blue with light ripples
rect(0, 0, 1024, 1024, '#2c64b4');
for (let y = 0; y < 1024; y += px) for (let x = 0; x < 1024; x += px) if (rnd() < 0.18) rect(x, y, px, px, rnd() < 0.5 ? '#3772c4' : '#2659a3');
for (let k = 0; k < 34; k++) { const x = Math.floor(rnd() * 58) * px, y = Math.floor(rnd() * 62) * px; rect(x, y, px * (2 + Math.floor(rnd() * 3)), px / 2, '#8fc0ff'); }
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body></html>
