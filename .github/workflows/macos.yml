name: Mac app

# Build Townies.app for the Mac and a disk image (macos/build.sh), check it starts, and keep the dmg as this
# run's artifact (townies-mac). Signed and notarized when the Developer ID secrets are set (see below);
# otherwise ad-hoc signed, which opens on any Mac after a right-click › Open the first time.
on:
  push:
    branches: [main]
    paths: ['macos/**', 'ios/Townies/LocalServer.swift', 'js/**', 'css/**', 'index.html', 'fonts/**', 'data/**', '.github/workflows/macos.yml']
  workflow_dispatch:

concurrency:
  group: mac-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Optional: Developer ID signing. Secrets: MACOS_CERT_P12 (base64 of a .p12 with the "Developer ID
      # Application" certificate and its key) and MACOS_CERT_PASSWORD. The signing identity and team ID are
      # read from the certificate.
      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/build.keychain; PW=$(uuidgen)
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import $RUNNER_TEMP/cert.p12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')
          test -n "$ID" || { echo "::error::No Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "SIGN_ID=$ID" >> $GITHUB_ENV
          echo "TEAM_ID=$(echo "$ID" | sed -E 's/.*\(([A-Z0-9]+)\)$/\1/')" >> $GITHUB_ENV
      - name: Build the app and the disk image
        run: macos/build.sh
      # Notarization (Apple checks the signed app for malware and issues a ticket, stapled to the dmg so it
      # opens without a warning even offline). Secrets: NOTARY_APPLE_ID (the developer account's Apple ID) and
      # NOTARY_PASSWORD (an app-specific password for it, from appleid.apple.com).
      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PW: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit macos/build/Townies.dmg --apple-id "$APPLE_ID" --password "$APPLE_PW" --team-id "$TEAM_ID" --wait --timeout 30m | tee notary.log
          grep -q "status: Accepted" notary.log || { ID=$(grep -m1 "  id:" notary.log | awk '{print $2}'); xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$APPLE_PW" --team-id "$TEAM_ID" || true; exit 1; }
          xcrun stapler staple macos/build/Townies.dmg
          spctl -a -vv -t install macos/build/Townies.dmg
      - name: Check the app starts and the game loads
        run: |
          hdiutil attach macos/build/Townies.dmg -mountpoint /Volumes/Townies -nobrowse -quiet
          cp -R /Volumes/Townies/Townies.app $RUNNER_TEMP/
          hdiutil detach /Volumes/Townies -quiet
          APP=$RUNNER_TEMP/Townies.app
          test -f "$APP/Contents/Resources/Web/index.html" && test -f "$APP/Contents/Resources/Web/data/watertown.json.gz"
          lipo -archs "$APP/Contents/MacOS/Townies"
          "$APP/Contents/MacOS/Townies" -TowniesQuery "auto=live&speed=0&nonews=1" > app.log 2>&1 &
          PID=$!
          sleep 8
          curl -sf http://127.0.0.1:47131/index.html | head -3
          curl -sf -o /dev/null http://127.0.0.1:47131/js/main.js && echo "server ok"
          sleep 50
          mkdir -p shots; screencapture -x shots/mac-game.png || true
          kill $PID || true
          tail -20 app.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: townies-mac
          path: |
            macos/build/Townies.dmg
            shots
